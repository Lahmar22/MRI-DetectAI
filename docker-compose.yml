
services:
  airflow:
    build:
      context: .
      dockerfile: dockerfile
    working_dir: /app
    container_name: mri-airflow
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ./dag:/opt/airflow/dags
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./dashbord:/app/dashbord
      - ./yolo:/app/yolo
      - ./yolov8n.pt:/app/yolov8n.pt
      - ./runs:/app/runs
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /app:/app/src
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: dockerfile
    working_dir: /app
    container_name: mri-streamlit
    entrypoint: ["streamlit"]
    command:
      - run
      - /app/dashbord/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./dashbord:/app/dashbord
      - ./yolo:/app/yolo
      - ./yolov8n.pt:/app/yolov8n.pt
      - ./runs:/app/runs
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
